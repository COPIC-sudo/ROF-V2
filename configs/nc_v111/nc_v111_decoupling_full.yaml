project:
  work_dir: ${ROF_WORK_DIR}
  output_dir: results/nc_v111_decoupling_audit/full

inputs:
  waymo_features_csv: ${ROF_WORK_DIR}/features/rof_features_val_full.csv
  waymo_labels_csv: ${ROF_WORK_DIR}/labels/labels_actionability_moderate_full.csv
  v096_variant_label_dir: results/nc_v096_endpoint_design_robustness/variant_labels
  v097_aligned_feature_dir: results/nc_v097_aligned_feature_robustness/aligned_features
  v097_oof_predictions_csv: results/nc_v097_aligned_feature_robustness/aligned_feature_oof_predictions.csv
  v110_lattice_base_dir: ${ROF_WORK_DIR}/results/nc_v110_commonroad_scaleup/full_10k_fixed_taxonomy_lattice_base
  v110_lattice_extended_dir: ${ROF_WORK_DIR}/results/nc_v110_commonroad_scaleup/full_10k_lattice_extended_fixed_taxonomy
  v112_lattice_base_dir: ${ROF_WORK_DIR}/results/nc_v112_field_baselines/full_10k_fixed_taxonomy_lattice_base
  v112_lattice_extended_dir: ${ROF_WORK_DIR}/results/nc_v112_field_baselines/full_10k_lattice_extended_fixed_taxonomy

variants:
  h2_buffer3_base7:
    label_variant_id: horizon_h2_b3_base7_skip
    feature_variant_id: horizon_h2_b3_base7_skip
  h3_buffer3_base7:
    label_variant_id: reference_h3_b3_base7_skip
    feature_variant_id: reference_h3_b3_base7_skip
  h4_buffer3_base7:
    label_variant_id: horizon_h4_b3_base7_skip
    feature_variant_id: horizon_h4_b3_base7_skip
  h3_buffer2_base7:
    label_variant_id: buffer_h3_b2_base7_skip
    feature_variant_id: buffer_h3_b2_base7_skip
  h3_buffer4_base7:
    label_variant_id: buffer_h3_b4_base7_skip
    feature_variant_id: buffer_h3_b4_base7_skip
  h3_buffer3_extended:
    label_variant_id: action_h3_b3_extended_skip
    feature_variant_id: action_h3_b3_extended_skip

evaluation:
  endpoint: actionability_critical_or_worse
  positive_rule: actionability_label_id_ge_2
  model: rf
  outer_folds: 5
  scenario_hash_seed: 42
  bootstrap_replicates: 1000
  bootstrap_seed: 42
  grouped_units:
    - scenario_id
    - segment_id
  primary_metrics:
    - AUPRC
    - strict Recall@5%FPR
  secondary_metrics:
    - AUROC
    - strict Recall@1%FPR
