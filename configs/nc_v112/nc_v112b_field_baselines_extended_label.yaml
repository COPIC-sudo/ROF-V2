project:
  work_dir: ${ROF_WORK_DIR}
  output_dir: results/nc_v112_field_baselines/full_10k_lattice_extended_fixed_taxonomy

inputs:
  endpoint_source_run: nc_v110_commonroad_scaleup/full_10k_lattice_extended_fixed_taxonomy
  planner_labels_csv: ${ROF_WORK_DIR}/results/nc_v110_commonroad_scaleup/full_10k_lattice_extended_fixed_taxonomy/planner_labels.csv
  rof_scores_csv: ${ROF_WORK_DIR}/results/nc_v110_commonroad_scaleup/full_10k_lattice_extended_fixed_taxonomy/feature_score_table.csv
  baseline_score_source_run: nc_v112_field_baselines/full_10k_fixed_taxonomy_lattice_base
  commonroad_crime_scores_csv: ${ROF_WORK_DIR}/results/nc_v112_field_baselines/full_10k_fixed_taxonomy_lattice_base/commonroad_crime_scores.csv
  rss_scores_csv: ${ROF_WORK_DIR}/results/nc_v112_field_baselines/full_10k_fixed_taxonomy_lattice_base/rss_scores.csv
  drivability_baseline_scores_csv: ${ROF_WORK_DIR}/results/nc_v112_field_baselines/full_10k_fixed_taxonomy_lattice_base/drivability_baseline_scores.csv
  forecast_risk_scores_csv: ${ROF_WORK_DIR}/results/nc_v112_field_baselines/full_10k_fixed_taxonomy_lattice_base/forecast_risk_scores.csv

cohort_lock:
  source_run: nc_v110_commonroad_scaleup/full_10k_lattice_extended_fixed_taxonomy
  no_resampling: true
  no_baseline_score_extraction: true
  reuse_existing_v112_baseline_scores: true
  no_v112_result_driven_cohort_changes: true

endpoint:
  label_source: lattice_extended_fixed_taxonomy
  positive: known_failure
  negative: no_failure
  exclude: unknown_failure
  claim_boundary: action-library-extended endpoint sensitivity only; no native-planner robustness claim

evaluation:
  bootstrap_unit: scenario_id
  bootstrap_replicates: 2000
  bootstrap_seed: 42
  primary_metrics:
    - AUPRC
    - strict Recall@5%FPR
  secondary_metrics:
    - AUROC
    - strict Recall@1%FPR
  enhanced_scores:
    - temporal_composite
    - ROF_v2_no_asr_composite
