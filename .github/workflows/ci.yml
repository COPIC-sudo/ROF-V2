name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m compileall -q src scripts tests figure_tools
      - run: pytest -q
      - run: python scripts/99_smoke_test.py
      - run: python scripts/99_check_github_readiness.py --root .
      - run: python scripts/99_verify_paper_release.py --root .
