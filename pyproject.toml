[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rof-actionability"
version = "1.1.0"
description = "Feasible-action-collapse labels, external planner-facing validation, and paper analyses for autonomous-driving emergencies"
readme = "README.md"
requires-python = ">=3.10,<3.11"
license = {file = "LICENSE"}
authors = [{name = "ROF Actionability Authors"}]
keywords = [
  "autonomous driving",
  "actionability",
  "reachability",
  "risk assessment",
  "Waymo",
  "CommonRoad",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<2.0",
  "pandas>=2.0,<2.3",
  "protobuf==6.31.1",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
  "shapely>=2.0",
  "scipy>=1.11",
  "tqdm>=4.66",
  "Pillow>=10.0",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
commonroad = [
  "commonroad-io",
  "commonroad-drivability-checker",
  "commonroad-crime",
]
torch = ["torch"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
